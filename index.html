<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de score de interação · Tatiana Barros</title>
    <meta name="description" content="Ajuste engajamento, sentimento, influência e timing e calcule como cada variável muda o score de uma interação.">
    <meta name="author" content="Tatiana Barros">
    <link rel="canonical" href="https://tatyquebralayout.github.io/Simulador_MVP_score/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="Tatiana Barros">
    <meta property="og:title" content="Simulador de score de interação · Tatiana Barros">
    <meta property="og:description" content="Ajuste engajamento, sentimento, influência e timing e calcule como cada variável muda o score de uma interação.">
    <meta property="og:url" content="https://tatyquebralayout.github.io/Simulador_MVP_score/">
    <meta property="og:image" content="https://tatyquebralayout.github.io/Simulador_MVP_score/og.png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="640">
    <meta property="og:image:alt" content="Simulador de score de interação de Tatiana Barros">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Simulador de score de interação · Tatiana Barros">
    <meta name="twitter:description" content="Ajuste engajamento, sentimento, influência e timing e calcule como cada variável muda o score de uma interação.">
    <meta name="twitter:image" content="https://tatyquebralayout.github.io/Simulador_MVP_score/og.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <div class="header">
            <h1>Simulador MVP Score</h1>
            <p>Ajuste os parâmetros para calcular o score</p>
        </div>

        <div class="controls">
            <input type="file" id="inputJsonFile" accept="application/json" aria-label="Carregar parâmetros de um arquivo JSON (Load parameters from a JSON file)">
            <div class="component-card">
                <label for="volume">Volume:</label>
                <input type="number" id="volume" step="0.1">
            </div>
            <div class="component-card">
                <label for="velocidade_engajamento">Velocidade de Engajamento:</label>
                <input type="number" id="velocidade_engajamento" step="0.1">
            </div>
            <div class="component-card">
                <label for="qualidade">Qualidade:</label>
                <input type="number" id="qualidade" step="0.1">
            </div>
            <div class="component-card">
                <label for="polaridade">Polaridade:</label>
                <input type="number" id="polaridade" step="0.1">
            </div>
            <div class="component-card">
                <label for="intensidade">Intensidade:</label>
                <input type="number" id="intensidade" step="0.1">
            </div>
            <div class="component-card">
                <label for="contexto">Contexto:</label>
                <input type="number" id="contexto" step="0.1">
            </div>
            <div class="component-card">
                <label for="alcance">Alcance:</label>
                <input type="number" id="alcance" step="0.1">
            </div>
            <div class="component-card">
                <label for="credibilidade">Credibilidade:</label>
                <input type="number" id="credibilidade" step="0.1">
            </div>
            <div class="component-card">
                <label for="historico">Histórico:</label>
                <input type="number" id="historico" step="0.1">
            </div>
            <div class="component-card">
                <label for="momento">Momento:</label>
                <input type="number" id="momento" step="0.1">
            </div>
            <div class="component-card">
                <label for="velocidade_timing">Velocidade Timing:</label>
                <input type="number" id="velocidade_timing" step="0.1">
            </div>
            <div class="component-card">
                <label for="oportunidade">Oportunidade:</label>
                <input type="number" id="oportunidade" step="0.1">
            </div>
        </div>

        <div class="results">
            <h2>Resultado Final</h2>
            <div class="score-circle" id="finalScore">5.0</div>
            <button id="calcularScoreButton">Calcular Score</button>
            <button id="baixarRelatorioButton">Baixar Relatório</button>
        </div>
    </main>

    <script src="js/score.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
